name: Home evaluation request intake

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write

jobs:
  acknowledge:
    if: contains(github.event.issue.body, 'home-evaluation-request')
    runs-on: ubuntu-latest
    steps:
      - name: Label and acknowledge request
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const labels = [
              { name: "home-evaluation", color: "0f6b63", description: "Home evaluation request from the public site" },
              { name: "queued", color: "fff0cf", description: "Evaluation request is queued" }
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: labels.map((label) => label.name)
            });

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const marker = "<!-- home-evaluation-ack -->";
            if (comments.some((comment) => comment.body && comment.body.includes(marker))) {
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: [
                marker,
                "Request received.",
                "",
                "You can track it on the public status page:",
                "https://mass-efa.github.io/home-search/requests.html",
                "",
                "Next publishing steps:",
                "",
                "1. Run the `home-evaluation` skill using the listing/address and notes in this issue.",
                "2. Create a public HTML brief under `homes/`.",
                "3. Add the brief to `data/homes.json`.",
                "4. Push to `main`; GitHub Pages will publish the result.",
                "",
                "Privacy reminder: this issue and any published brief are public."
              ].join("\n")
            });
