name: Start home analysis

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "GitHub issue number for the queued home evaluation request"
        required: true
        type: number

permissions:
  issues: write

jobs:
  mark-analyzing:
    runs-on: ubuntu-latest
    steps:
      - name: Move request from queued to analyzing
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = Number(core.getInput("issue_number"));

            const labels = [
              { name: "analyzing", color: "e3eef7", description: "Evaluation analysis is in progress" },
              { name: "published", color: "e7f2eb", description: "Evaluation page has been published" }
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
            }

            try {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number,
                name: "queued"
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: ["analyzing"]
            });

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const marker = "<!-- home-analysis-started -->";
            if (comments.some((comment) => comment.body && comment.body.includes(marker))) {
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: [
                marker,
                "Analysis started.",
                "",
                "Current status: `analyzing`.",
                "",
                "Next steps:",
                "",
                "1. Run the `home-evaluation` skill using this issue's listing/address.",
                "2. Generate the public HTML brief under `homes/`.",
                "3. Add the brief to `data/homes.json`.",
                "4. Push to `main`.",
                "5. Replace `analyzing` with `published` and close this issue."
              ].join("\n")
            });
